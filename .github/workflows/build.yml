name: Build Yantra Pro APK
on: 
  workflow_dispatch: # Allows you to manually trigger the build with a button

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle' # Speeds up future builds

      - name: Grant Execute Permission for Gradle
        run: chmod +x ./gradlew

      - name: Build Pro Debug APK
        run: ./gradlew assembleProDebug -PweatherAPIkey="dummy_key" -PbackupPassword="dummy_password"


      - name: Upload Compiled APK to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Yantra-Pro-Debug-APK
          path: app/build/outputs/apk/pro
